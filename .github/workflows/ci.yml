name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 以下三项是「护栏」：任何一条不过，说明 AI 或人改出了不该有的东西
      - name: Shader contract (uniform / varying 声明一致性)
        run: npm run check:contract

      - name: Docs claims (文档里的性能数字必须有出处)
        run: npm run check:claims

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
